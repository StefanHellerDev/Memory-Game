<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./src/assets/img/button_controller.png" type="image/x-icon">
  <title>Memory Game</title>
  <script type="module" src="./src/main.ts"></script>
</head>

<body data-theme="memory">
  <div id="memoryApp"></div>


  <main class="main-page">

    <section class="main-page--content">

      <header class="main-page__settings-header">
        <h1>Settings</h1>
        <img src="./src/assets/img/settings-header-line.png" alt="Header underline">
      </header>

      <section class="main-page--content">

        <form>

          <fieldset class="settings-group">
            <legend class="settings-group--legend">
              <img src="./src/assets/img/image_game_themes.png" alt="">
              Game themes
            </legend>

            <label>
              <input type="radio" name="" id="">
              Code vibes theme
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>

            <label>
              <input type="radio" name="" id="">
              Food theme
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>

          </fieldset>

          <fieldset class="settings-group">
            <legend>
              <img src="./src/assets/img/image_choose_player.png" alt="">
              Choose player
            </legend>

            <label>
              <input type="radio" name="" id="">
              Blue
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>

            <label>
              <input type="radio" name="" id="">
              Orange
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>
          </fieldset>

          <fieldset class="settings-group">
            <legend>
              <img src="./src/assets/img/image_Board_size.png" alt="">
              Board size
            </legend>

            <label>
              <input type="radio" name="" id="">
              16 cards
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>

            <label>
              <input type="radio" name="" id="">
              24 cards
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>

            <label>
              <input type="radio" name="" id="">
              36 cards
              <img src="./src/assets/img/settings-line.png" alt="Settings line">
            </label>
          </fieldset>

        </form>

        <aside>
          Bild
          <section>
            Game theme Player Board size Start
          </section>
        </aside>

      </section>

    </section>

  </main>

</body>

</html>
